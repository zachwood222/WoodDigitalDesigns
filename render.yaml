services:
  - type: web
    name: wood-digital-designs
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OWNER_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_WEBHOOK_URL
        sync: false
